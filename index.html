<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K53 eNaTIS Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-black text-blue-700">K53 Exam Prep</h1>
            <p class="text-sm text-slate-500 mt-1">Touchscreen System Simulator</p>
        </header>
        <div id="quiz-card" class="bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <span id="current-category" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Loading...</span>
                <span id="progress-text" class="text-sm font-semibold text-slate-500">0 / 0</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-800"></h2>
            <div id="options-container" class="space-y-3"></div>
            <button id="next-btn" class="mt-8 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg hidden">Confirm Selection</button>
        </div>
        <div id="results-card" class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200 hidden text-center">
            <h2 id="verdict-title" class="text-3xl font-black mb-4">Evaluating...</h2>
            <p id="verdict-desc" class="text-slate-600 mb-8"></p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-left mb-8">
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200"><p class="text-xs font-bold uppercase text-slate-400">Rules</p><p id="score-rules" class="text-2xl font-black mt-1"></p><p class="text-xs text-slate-500">Pass: 22/28</p></div>
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200"><p class="text-xs font-bold uppercase text-slate-400">Signs</p><p id="score-signs" class="text-2xl font-black mt-1"></p><p class="text-xs text-slate-500">Pass: 23/28</p></div>
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200"><p class="text-xs font-bold uppercase text-slate-400">Controls</p><p id="score-controls" class="text-2xl font-black mt-1"></p><p class="text-xs text-slate-500">Pass: 6/8</p></div>
            </div>
            <button onclick="initialiseTest()" class="bg-slate-900 hover:bg-black text-white font-bold py-3.5 px-8 rounded-xl">Start New Test</button>
        </div>
    </div>
    <script>
        let masterPool = []; let activeExamQuestions = []; let currentIdx = 0; let selectedAnsIdx = null; let sessionScores = { rules: 0, signs: 0, controls: 0 };
        async function fetchQuestions() { try { const response = await fetch('questions.json'); masterPool = await response.json(); initialiseTest(); } catch (err) { document.getElementById('question-text').innerText = "Error loading questions.json"; } }
        function initialiseTest() { currentIdx = 0; selectedAnsIdx = null; sessionScores = { rules: 0, signs: 0, controls: 0 }; document.getElementById('results-card').classList.add('hidden'); document.getElementById('quiz-card').classList.remove('hidden'); const rules = masterPool.filter(q => q.category === 'rules').sort(() => 0.5 - Math.random()); const signs = masterPool.filter(q => q.category === 'signs').sort(() => 0.5 - Math.random()); const controls = masterPool.filter(q => q.category === 'controls').sort(() => 0.5 - Math.random()); activeExamQuestions = [...rules.slice(0, 28), ...signs.slice(0, 28), ...controls.slice(0, 8)]; if (activeExamQuestions.length === 0) { activeExamQuestions = [...masterPool].sort(() => 0.5 - Math.random()); } renderQuestion(); }
        function renderQuestion() { selectedAnsIdx = null; document.getElementById('next-btn').classList.add('hidden'); if (currentIdx >= activeExamQuestions.length) { showResults(); return; } const q = activeExamQuestions[currentIdx]; document.getElementById('current-category').innerText = q.category; document.getElementById('progress-text').innerText = `Question ${currentIdx + 1} of ${activeExamQuestions.length}`; document.getElementById('progress-bar').style.width = `${(currentIdx / activeExamQuestions.length) * 100}%`; document.getElementById('question-text').innerText = q.question; const container = document.getElementById('options-container'); container.innerHTML = ''; q.options.forEach((opt, idx) => { const btn = document.createElement('button'); btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white font-medium flex justify-between items-center cursor-pointer shadow-xs"; btn.innerHTML = `<span>${opt}</span><div class='w-5 h-5 rounded-full border border-slate-300' id='indicator-${idx}'></div>`; btn.onclick = () => { selectedAnsIdx = idx; selectHighlight(idx, q.options.length); }; container.appendChild(btn); }); }
        function selectHighlight(chosenIdx, total) { for (let i = 0; i < total; i++) { const btn = document.getElementById('options-container').children[i]; const ind = document.getElementById(`indicator-${i}`); if (i === chosenIdx) { btn.className = "w-full text-left p-4 rounded-xl border-2 border-blue-600 bg-blue-50 font-medium flex justify-between items-center cursor-pointer"; ind.className = "w-5 h-5 rounded-full bg-blue-600 text-white text-center text-xs font-bold"; ind.innerText = "✓"; } else { btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white font-medium flex justify-between items-center cursor-pointer"; ind.className = "w-5 h-5 rounded-full border border-slate-300"; ind.innerText = ""; } } document.getElementById('next-btn').classList.remove('hidden'); }
        document.getElementById('next-btn').onclick = () => { const q = activeExamQuestions[currentIdx]; if (selectedAnsIdx === q.answer) { sessionScores[q.category]++; } currentIdx++; renderQuestion(); };
        function showResults() { document.getElementById('quiz-card').classList.add('hidden'); document.getElementById('results-card').classList.remove('hidden'); const r = sessionScores.rules; const s = sessionScores.signs; const c = sessionScores.controls; document.getElementById('score-rules').innerText = `${r} / 28`; document.getElementById('score-signs').innerText = `${s} / 28`; document.getElementById('score-controls').innerText = `${c} / 8`; const title = document.getElementById('verdict-title'); const desc = document.getElementById('verdict-desc'); if (r >= 22 && s >= 23 && c >= 6) { title.innerText = "🎉 PASSED"; title.className = "text-3xl font-black text-emerald-600 mb-2"; desc.innerText = "You passed all K53 test thresholds!"; } else { title.innerText = "❌ FAILED"; title.className = "text-3xl font-black text-rose-600 mb-2"; desc.innerText = "You failed to meet the passing marks on at least one sections."; } }
        fetchQuestions();
    </script>
</body>
</html>
